name: Build BlissOS18 voyager-x86 Android15 GApps ISO
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: 前置深度清理
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache
          sudo apt autoremove -y && sudo apt clean
          sudo rm -rf /tmp/* ~/.cache/*
          df -h

      - name: 扩容构建分区（空间挂载到 /build）
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-docker-images: true

      - name: 安装编译依赖
        run: |
          set -e
          sudo apt update
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y git curl gnupg flex bison gperf build-essential zip \
          zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
          x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python3

      - name: 准备repo工具 + Git配置（工作目录切到 /build）
        working-directory: /build
        run: |
          set -e
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ./repo
          chmod +x ./repo
          ./repo --version
          git config --global user.name "Github Actions Builder"
          git config --global user.email "builder@actions.local"
          git config --global core.compression -1
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 60
          df -h

      - name: Repo Init voyager-x86
        working-directory: /build
        run: |
          set -e
          ./repo init -u https://github.com/BlissOS/platform_manifest.git -b voyager-x86 --git-lfs --depth=1

      - name: Repo Sync（降并发+超时保护）
        timeout-minutes: 60
        working-directory: /build
        run: |
          set -e
          echo "开始同步源码"
          ./repo sync -c -j2 --verbose --force-sync --no-tags --no-clone-bundle --optimized-fetch --prune
          echo "源码同步完成"
          df -h

      - name: Build GApps ISO
        timeout-minutes: 360
        working-directory: /build
        run: |
          set -e
          source build/envsetup.sh
          lunch bliss_x86_64-userdebug
          mka iso_img
          ls -lh out/target/product/x86_64/*.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS18-voyager-x86-GApps
          path: /build/out/target/product/x86_64/*.iso
