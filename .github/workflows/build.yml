name: Build BlissOS18 voyager-x86 Android15 GApps ISO
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Ultra Deep Clean
        run: |
          set -e
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache /opt/ghc
          sudo rm -rf /usr/share/swift /usr/share/miniconda /usr/local/share/boost /usr/local/share/powershell
          sudo apt autoremove -y && sudo apt clean
          sudo rm -rf /tmp/* ~/.cache/*
          df -h

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          swap-size-mb: 16384
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          root-reserve-mb: 512

      - name: Install build dependencies
        run: |
          set -e
          sudo apt update
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y git curl gnupg flex bison gperf build-essential zip \
          zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
          x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python3

      - name: Fetch local repo script + Git配置
        run: |
          set -e
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ./repo
          chmod +x ./repo
          ./repo --version
          git config --global user.name "Github Actions Builder"
          git config --global user.email "builder@actions.local"
          git config --global core.compression -1
          git config --global http.postBuffer 524288000

      - name: Repo Init voyager-x86
        run: |
          set -e
          ./repo init -u https://github.com/BlissOS/platform_manifest.git -b voyager-x86 --git-lfs --depth=1

      - name: Repo Sync
        run: |
          set -e
          echo "开始同步源码，使用浅克隆减少下载体积"
          ./repo sync -c -j$(nproc) --verbose --force-sync --no-tags --no-clone-bundle --optimized-fetch --prune
          echo "源码同步完成"

      - name: Build GApps ISO
        run: |
          set -e
          source build/envsetup.sh
          lunch bliss_x86_64-userdebug
          mka iso_img
          ls -lh out/target/product/x86_64/*.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS18-voyager-x86-GApps
          path: out/target/product/x86_64/*.iso

      - name: Complete job
        run: |
          echo "打包流程结束"
