name: Build BlissOS18 typhoon-x86 Emu-GApps ISO
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Free pre-installed bloat to save disk
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt clean
          sudo apt autoremove -y

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          swap-size-mb: 16384
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y git curl gnupg flex bison gperf build-essential zip \
          zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
          x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python3

      - name: Fetch local repo script
        run: |
          # 此处填入你原本拉取repo脚本的命令
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ./repo
          chmod +x ./repo

      - name: Repo Init
        run: |
          ./repo init -u https://github.com/BlissOS/manifest.git -b typhoon-x86 --depth=1

      - name: Repo Sync (Verbose详细日志，实时输出)
        run: |
          ./repo sync -c -j$(nproc) --verbose

      - name: Build GApps ISO
        run: |
          # 替换成你原来BlissOS编译目标命令
          source build/envsetup.sh
          lunch bliss_x86_64-userdebug
          make iso -j$(nproc)

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS18-typhoon-x86-GApps
          path: out/target/product/x86_64/*.iso

      - name: Complete job
        run: echo "Build job finished"
