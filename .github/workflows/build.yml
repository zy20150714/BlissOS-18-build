name: Build BlissOS18 typhoon-x86 Emu-GApps ISO
on:
  workflow_dispatch: # 手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build disk space
        uses: easimon/maximize-build-disk-space@v10
        with:
          swap-size-gb: 16

      - name: Install AOSP/BlissOS 编译依赖
        run: |
          sudo apt update
          sudo apt install -y git repo gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses6-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip squashfs-tools python3-mako libssl-dev ninja-build lunzip syslinux syslinux-utils gettext genisoimage bc xorriso xmlstarlet meson glslang-tools git-lfs libncurses6 libncurses6:i386 libelf-dev aapt zstd rdfind nasm

      - name: Init & Sync Repo + 拉取GApps LFS资源
        run: |
          mkdir -p bliss && cd bliss
          repo init -u https://github.com/BlissOS/platform_manifest.git -b typhoon-x86
          repo sync -c --force-sync --no-tags --no-clone-bundle --optimized-fetch --prune -j$(nproc)
          repo forall -c git lfs pull

      - name: 编译 Emu-GApps 完整版ISO
        run: |
          cd bliss
          . build/envsetup.sh
          lunch bliss_x86_64-userdebug
          export BLISS_BUILD_VARIANT=gapps
          make iso_img -j$(nproc)

      - name: 上传成品ISO
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS18-typhoon-x86_64-EmuGApps-ISO
          path: bliss/out/target/product/x86_64/*.iso
